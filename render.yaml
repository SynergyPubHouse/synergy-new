services:
  # ===== OPTION 1: Docker Build (Primary) =====
  # If this works, use it. Render will build using the ./Dockerfile
  - type: web
    name: synergy-world-press
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerfile:
      context: .
      dockerfile: ./Dockerfile
    envVars:
      - key: NODE_ENV
        value: production
      - key: USE_PUPPETEER_FALLBACK
        value: "false"
      - key: LIBREOFFICE_BIN
        value: /usr/bin/soffice

  # ===== OPTION 2: Node Buildpack with render-build.sh (Fallback) =====
  # If Docker build fails, comment out OPTION 1 above and uncomment this section
  # - type: web
  #   name: synergy-world-press
  #   env: node
  #   plan: free
  #   buildCommand: bash render-build.sh
  #   startCommand: node backend/server.js
  #   envVars:
  #     - key: NODE_ENV
  #       value: production
  #     - key: USE_PUPPETEER_FALLBACK
  #       value: "false"
  #     - key: LIBREOFFICE_BIN
  #       value: /usr/bin/soffice
